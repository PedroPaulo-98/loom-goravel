{{define "auth-content"}}
<form method="post" action="{{.ResetURL}}" class="space-y-5" novalidate>
  <input type="hidden" name="_token" value="{{.CSRF}}">
  <input type="hidden" name="token" value="{{.Token}}">
  {{with field .Errors "email"}}<div class="rounded-lg bg-danger-50 px-3 py-2 text-sm text-danger-700 dark:bg-danger-500/10 dark:text-danger-300" role="alert">{{.}}</div>{{end}}
  <div>
    <label for="email" class="mb-1.5 block text-sm font-medium text-gray-700 dark:text-gray-200">E-mail</label>
    <input id="email" name="email" type="email" readonly value="{{field .Old "email"}}" class="{{template "auth-input-class"}} opacity-70">
  </div>
  <div>
    <label for="password" class="mb-1.5 block text-sm font-medium text-gray-700 dark:text-gray-200">Nova senha</label>
    <input id="password" name="password" type="password" required autofocus autocomplete="new-password" class="{{template "auth-input-class"}}">
    {{with field .Errors "password"}}<p class="mt-1.5 text-sm text-danger-600 dark:text-danger-400">{{.}}</p>{{end}}
  </div>
  <div>
    <label for="password_confirmation" class="mb-1.5 block text-sm font-medium text-gray-700 dark:text-gray-200">Confirmar nova senha</label>
    <input id="password_confirmation" name="password_confirmation" type="password" required autocomplete="new-password" class="{{template "auth-input-class"}}">
  </div>
  {{template "auth-button" "Redefinir senha"}}
</form>
{{end}}

{{define "auth-footer"}}
<p class="mt-6 text-center text-sm text-gray-500 dark:text-gray-400">
  <a href="{{.LoginURL}}" class="font-semibold text-primary-600 hover:text-primary-500 dark:text-primary-400">← Voltar para o login</a>
</p>
{{end}}
