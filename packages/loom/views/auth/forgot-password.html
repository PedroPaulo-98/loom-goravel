{{define "auth-content"}}
<form method="post" action="{{.ForgotURL}}" class="space-y-5" novalidate>
  <input type="hidden" name="_token" value="{{.CSRF}}">
  <p class="text-sm text-gray-600 dark:text-gray-300">Informe o e-mail da sua conta e enviaremos um link para criar uma nova senha.</p>
  <div>
    <label for="email" class="mb-1.5 block text-sm font-medium text-gray-700 dark:text-gray-200">E-mail</label>
    <input id="email" name="email" type="email" required autofocus autocomplete="email" value="{{field .Old "email"}}" class="{{template "auth-input-class"}}">
    {{with field .Errors "email"}}<p class="mt-1.5 text-sm text-danger-600 dark:text-danger-400">{{.}}</p>{{end}}
  </div>
  {{template "auth-button" "Enviar link"}}
</form>
{{end}}

{{define "auth-footer"}}
<p class="mt-6 text-center text-sm text-gray-500 dark:text-gray-400">
  <a href="{{.LoginURL}}" class="font-semibold text-primary-600 hover:text-primary-500 dark:text-primary-400">← Voltar para o login</a>
</p>
{{end}}
