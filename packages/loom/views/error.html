{{define "content"}}
<div class="rounded-xl border border-gray-200 bg-white p-12 text-center shadow-sm dark:border-white/10 dark:bg-gray-900">
  <div class="text-5xl font-bold text-gray-300 dark:text-gray-600">{{.Code}}</div>
  <h1 class="mt-4 text-xl font-semibold">{{.Title}}</h1>
  <p class="mt-2 text-sm text-gray-500 dark:text-gray-400">{{.Message}}</p>
  <a href="{{.HomeURL}}" class="mt-6 inline-block rounded-lg bg-primary-600 px-4 py-2 text-sm font-semibold text-white hover:bg-primary-500">Voltar ao início</a>
</div>
{{end}}
