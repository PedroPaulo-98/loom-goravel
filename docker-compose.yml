# docker compose up -d --build   -> http://localhost
#
# Reads the variables from .env (APP_KEY, DB_DATABASE, DB_USERNAME,
# DB_PASSWORD, MAIL_*...). Only the ones that change inside Docker are
# overridden below.

services:
  goravel:
    build:
      context: .
    env_file: .env
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: 3000
      APP_URL: ${DOCKER_APP_URL:-http://localhost}
      DB_CONNECTION: postgres
      DB_HOST: db
      DB_PORT: 5432
    # Runs pending migrations, then starts the server.
    entrypoint: ["sh", "-c", "/www/main artisan migrate && exec /www/main"]
    ports:
      - "80:3000"
    volumes:
      - storage:/www/storage
    depends_on:
      db:
        condition: service_healthy
    restart: always

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: always

volumes:
  pgdata:
  storage:
